<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>音乐可视化工坊 · music-visualization</title>
  <link rel="icon" href="favicon.svg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <canvas id="canvas"></canvas>
    <div id="ui-overlay">
      <header id="top-bar">
        <h1>音乐可视化工坊</h1>
        <div id="audio-controls">
          <label class="file-input-wrap">
            <input type="file" id="audio-file" accept="audio/*" title="拖入或点选音频文件">
            <span>📁 音频文件</span>
          </label>
          <button id="mic-toggle" title="麦克风输入（需授权）">🎤</button>
          <button id="play-pause" title="播放/暂停">▶️</button>
          <input type="range" id="seek" min="0" max="100" value="0" step="1" title="进度">
          <input type="range" id="volume" min="0" max="100" value="80" step="1" title="音量">
        </div>
      </header>
      <aside id="side-panel">
        <section>
          <label>可视化模式</label>
          <select id="viz-select">
            <option value="bars">频谱柱状</option>
            <option value="particles">粒子场</option>
            <option value="waveform">波形线</option>
            <option value="radial">极坐标</option>
            <option value="circular-bars">圆环频谱</option>
          </select>
        </section>
        <section>
          <label>配色方案</label>
          <select id="palette-select">
            <option value="neon">霓虹</option>
            <option value="sunset">暖色</option>
            <option value="ocean">海洋</option>
            <option value="mono">单色</option>
            <option value="random">随机</option>
          </select>
        </section>
        <section>
          <label>灵敏度 <span id="sens-val">1.0</span></label>
          <input type="range" id="sensitivity" min="0.1" max="3" value="1" step="0.1">
        </section>
        <section>
          <label>平滑度 <span id="smooth-val">0.8</span></label>
          <input type="range" id="smoothing" min="0" max="0.99" value="0.8" step="0.01">
        </section>
        <section>
          <label>FFT 大小</label>
          <select id="fft-select">
            <option value="256">256</option>
            <option value="512" selected>512</option>
            <option value="1024">1024</option>
            <option value="2048">2048</option>
          </select>
        </section>
        <section class="hint">
          <kbd>Space</kbd> 播放/暂停 · <kbd>←/→</kbd> 快退/快进 5s · <kbd>↑/↓</kbd> 音量 · <kbd>F</kbd> 全屏 · <kbd>W/S</kbd> 切模式 · <kbd>A/D</kbd> 切配色
        </section>
      </aside>
    </div>
  </div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
